[workspace]
resolver = "2"
members = [
    "crates/piton-core",
    "crates/piton-syntax",
    "crates/piton-compile",
    "crates/piton-emit",
    "crates/piton-belay",
    "crates/piton-lsp",
    "crates/piton-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mctavishdynamics/piton"

[workspace.dependencies]
piton-core = { path = "crates/piton-core" }
piton-syntax = { path = "crates/piton-syntax" }
piton-compile = { path = "crates/piton-compile" }
piton-emit = { path = "crates/piton-emit" }
piton-belay = { path = "crates/piton-belay" }
piton-lsp = { path = "crates/piton-lsp" }

chumsky = "0.9.3"
rowan = "0.15.19"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
globset = "0.4"
walkdir = "2"
camino = "1"
similar = "2"

[profile.release]
opt-level = 2
