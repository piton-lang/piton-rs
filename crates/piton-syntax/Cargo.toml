[package]
name = "piton-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
piton-core.workspace = true
chumsky.workspace = true
rowan.workspace = true

[dev-dependencies]
# Validates the regex in the editor configurations that opens a block. Zed
# compiles it with this crate.
regex = "1"
# The highlighter corpus (`tests/highlight_corpus.rs`). `toml` reads
# `scopes.toml` and `gaps.toml`. The TextMate runner prints JSON. `syntect`
# runs the Sublime definition. `syntect` is a pure-Rust engine for that
# format. Thus that runner needs no installed editor.
toml = "0.8"
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
