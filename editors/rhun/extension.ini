# Piton for rhun: the grammar in syntax/piton.syn, and the language server.
#
# rhun talks to extensions in its own protocol, not in LSP. The program here
# is rhun-editor/lsp, the first-party bridge, with lsp.patch on top: it serves
# Piton only, and starts `piton lsp`. build.sh builds it into bin/.
name = piton
owner = piton-lang
title = Piton
description = Piton highlighting, and the Piton language server (piton lsp): problems, completion, hover, navigation, rename, formatting and semantic colors.
color = #3f8f5f
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/piton-lsp-linux-x86_64
run.macos-arm64 = bin/piton-lsp-macos-arm64
run.windows-x64 = bin/piton-lsp-windows-x64.exe
on = lang:Piton

[commands]
setup = Set Up Piton Language Server
restart = Restart Piton Language Server
reload_configuration = Reload Piton Language Server Settings
cancel_progress = Cancel Piton Language Server Work

[subscribe]
opened = *.pi
saved = *.pi
edits = *.pi
hover = *.pi

[needs]
documents = write
# The server reads the project. rhun writes the edits of a rename.
project = read
# The sandbox starts only the programs this list names.
run = piton

[provides]
complete = *.pi
complete.triggers = . { @ $ #
signature = *.pi
definition = *.pi
references = *.pi
symbols = *.pi
actions = *.pi
rename = *.pi
format = *.pi
folding = *.pi
semantic_tokens = *.pi
inlay_hints = *.pi
code_lens = *.pi
highlights = *.pi
save_actions = *.pi
hover = *.pi
type_definition = *.pi
selection_ranges = *.pi
workspace_symbols = *.pi
type_format = *.pi
type_format.triggers = newline
document_links = *.pi
