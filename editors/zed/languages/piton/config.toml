name = "Piton"
grammar = "piton"
path_suffixes = ["pi"]
line_comments = ["// "]
autoclose_before = "}]),"

# The language prefers four spaces and does not make it configurable, so the
# editor should not offer to.
tab_size = 4
hard_tabs = false

# A declaration or a key that ends where a value would begin opens a block,
# and the block is the indented lines beneath it: `anchor A:`, `frameworks:`,
# `config:: dictionary:`. A colon inside a value opens nothing -- `prompt:
# Careful: ` ends a sentence rather than a property -- and neither does a
# comment, whatever it happens to end with. The language server draws the
# same line in `on_type_formatting`; this pattern is what the editor has
# when it indents on its own.
#
# This is a line pattern rather than an `indents.scm` because the grammar has
# no node to hang one on: indentation is deliberately not in the grammar, so
# nothing there spans a body for Zed's `@indent` to measure.
increase_indent_pattern = "^[^/\\s][^:]*:\\s*$|^\\s*[^:/\\s]+(::\\s*[^:/\\s]+)*:\\s*$|^\\s*[-+]{1,2}\\s+[^:/\\s]+(::\\s*[^:/\\s]+)*:\\s*$"

# Keys and user keywords are kebab-case, so a hyphen is part of a word:
# double-clicking `no-rewrite` should take all of it, and typing the hyphen
# should carry on querying the language server rather than starting a new
# query at `r`.
word_characters = ["-"]
completion_query_characters = ["-"]

# `not_in` names scopes from `overrides.scm`. A quotation mark typed in prose
# is a quotation mark; only in an expression is it the start of a string.
[[brackets]]
start = "{"
end = "}"
close = true
newline = false
not_in = ["comment", "verbatim"]

[[brackets]]
start = "["
end = "]"
close = true
newline = false
not_in = ["comment", "verbatim"]

[[brackets]]
start = "\""
end = "\""
close = true
newline = false
not_in = ["comment", "string", "verbatim"]
