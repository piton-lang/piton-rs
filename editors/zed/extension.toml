id = "piton"
name = "Piton"
description = "Piton language support: tree-sitter highlighting and the Piton language server."
version = "0.1.0"
schema_version = 1
authors = ["Piton"]
repository = "https://github.com/mctavishdynamics/piton"

[grammars.piton]
# Zed fetches this exact revision and builds it, so the repository has to be
# one that holds the grammar at its root and the commit has to be a real SHA:
# `HEAD` is not an object that can be fetched, and a fetch that returns nothing
# is reported as a grammar that will not compile.
#
# `cargo xtask publish-grammar` pushes `editors/tree-sitter-piton` to that
# repository and rewrites the commit below to the one it pushed.
repository = "https://github.com/piton-lang/tree-sitter-piton"
commit = "8914c6263306b1c1b5c5718ba5ce452e8a54ad9f"

[language_servers.piton]
name = "Piton"
languages = ["Piton"]

# The server keys everything off the file's path, so the identifier only has to
# be stable. Naming it keeps Zed from sending the display name, which is
# capitalised.
[language_servers.piton.language_ids]
"Piton" = "piton"
