# Piton for Helix.
#
# Append to ~/.config/helix/languages.toml, then run `hx --grammar fetch` and
# `hx --grammar build`. The `piton` binary must be on PATH; install it with
# `cargo xtask install`. See README.md for the query files.

[language-server.piton]
command = "piton"
args = ["lsp"]

[[language]]
name = "piton"
scope = "source.piton"
file-types = ["pi"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
language-servers = ["piton"]
roots = ["piton.config.pi"]
# Autoformat on save is an option (the spec's autoFormatOnSave): it stays off
# here. Set it to true to format through the language server on save; the
# formatter adds the space after `//` and touches nothing else that is
# commented.
auto-format = false

[[grammar]]
name = "piton"
# The published grammar: the same repository and commit the Zed extension pins
# in editors/zed/extension.toml. It holds the grammar and the generated parser
# at its root, and the revision has to be a real commit -- `HEAD` is not
# something Helix can check out reproducibly.
source = { git = "https://github.com/piton-lang/tree-sitter-piton", rev = "8914c6263306b1c1b5c5718ba5ce452e8a54ad9f" }
