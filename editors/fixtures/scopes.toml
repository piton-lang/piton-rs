# The highlighting classes and what each syntax definition calls them.
#
# This is the one table every highlighter is tested against. A class is what
# the parser says a byte is (`piton_syntax::highlight::Class`, which writes
# `editors/fixtures/*.expected`); each row names the scope, capture, item or
# group that a format uses for it. The corpus runner in
# `crates/piton-syntax/tests/highlight_corpus.rs` reads a tool's output back
# through this table, so a name has to be unique within its format, and a byte
# whose name is not listed here is plain text.
#
# Prose is plain everywhere, and has no row: it is most of every file, and the
# structure around it is what should stand out. Flipping that decision is one
# row per format here, and a re-bless of the expectations.
#
# Columns:
#   tm       TextMate (VS Code) and Sublime scope
#   ts       tree-sitter capture (Zed, Helix, Neovim, Emacs)
#   kate     Kate itemData name, and the default style it uses
#   vim      Vim syntax group, and the default group it links to
#   emacs    the face `piton-ts-capture-faces` gives the capture

[Comment]
tm = "comment.line.double-slash.piton"
ts = "comment"
kate = "Comment"
kate_style = "dsComment"
vim = "pitonComment"
vim_link = "Comment"
emacs = "font-lock-comment-face"

